<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>IH 474 組立図 ログイン</title>
<style>:root{--bg:#f4f1ea;--fg:#1d1d1b;--mut:#6b675f;--acc:#c8102e;--card:#fff;--line:#d8d2c4}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#eceae4;--mut:#a29d92;--card:#22211e;--line:#3a3833}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif;padding:16px}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px}
h1{font-size:1.15rem;margin:0 0 4px}p{margin:0 0 20px;color:var(--mut);font-size:.9rem}
input{width:100%;font-size:1.1rem;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);letter-spacing:.1em}
button{margin-top:14px;width:100%;padding:12px;font-size:1rem;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer}button:disabled{opacity:.6}
#msg{min-height:1.4em;margin-top:12px;font-size:.9rem;color:var(--acc)}#out{margin-top:10px;background:none;color:var(--mut);border:1px solid var(--line)}</style></head>
<body><form id="f"><h1>IH 474 3D組立図</h1><p>合言葉を入れてください</p>
<input id="pw" type="password" autocomplete="current-password" autofocus aria-label="合言葉">
<button id="go">入る</button><div id="msg" role="status"></div><button id="out" type="button" hidden>この端末からログアウト</button></form>
<script>
const CFG={"salt":"E/lEnptucUTG3V70JY4m7w==","iter":600000,"hours":0},msg=document.getElementById('msg'),go=document.getElementById('go');
const next=new URLSearchParams(location.search).get('next')||'viewer/ih-tractor-assembly.html';
if(!('serviceWorker' in navigator)||!crypto.subtle)msg.textContent='このブラウザでは開けません（新しいChrome・Edge・Safariで開いてください）';
const sw=navigator.serviceWorker&&navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready);
function send(m){return sw.then(r=>new Promise(ok=>{navigator.serviceWorker.addEventListener('message',function h(e){if(e.data&&e.data.type==='done'){navigator.serviceWorker.removeEventListener('message',h);ok()}});r.active.postMessage(m)}))}
if(navigator.serviceWorker&&navigator.serviceWorker.controller)document.getElementById('out').hidden=false;
document.getElementById('out').onclick=async()=>{await send({type:'logout'});msg.textContent='ログアウトしました'};
document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();go.disabled=true;msg.textContent='確認中…';
  try{const salt=Uint8Array.from(atob(CFG.salt),c=>c.charCodeAt(0));
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveBits']);
    const raw=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:CFG.iter,hash:'SHA-256'},base,256);
    const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
    const b=new Uint8Array(await (await fetch('enc/check',{cache:'no-cache'})).arrayBuffer());
    try{await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},k,b.slice(12))}catch(_){msg.textContent='合言葉が違います';go.disabled=false;return}
    await send({type:'key',raw});location.href=next}
  catch(e){msg.textContent='開けませんでした：'+e.message;go.disabled=false}};
</script></body></html>
